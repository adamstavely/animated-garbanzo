apiVersion: v1
kind: Service
metadata:
  name: {{ include "nym.apiFullname" . }}
  labels:
    {{- include "nym.componentLabels" (dict "context" . "component" "api") | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.api.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nym.componentSelectorLabels" (dict "context" . "component" "api") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nym.webFullname" . }}
  labels:
    {{- include "nym.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
  {{- with (mergeOverwrite (deepCopy .Values.commonAnnotations) .Values.web.service.annotations) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "nym.componentSelectorLabels" (dict "context" . "component" "web") | nindent 4 }}
