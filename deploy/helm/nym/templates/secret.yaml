{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- include "nym.validateValues" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "nym.fullname" .) }}
  labels:
    {{- include "nym.labels" . | nindent 4 }}
  annotations:
    # The Secret outlives an uninstall so a reinstall does not invalidate every
    # signed-in session. Remove it deliberately when decommissioning.
    helm.sh/resource-policy: keep
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ .Values.secrets.databaseUrl | quote }}
  {{ .Values.secrets.keys.anthropicApiKey }}: {{ .Values.secrets.anthropicApiKey | quote }}
  {{ .Values.secrets.keys.oidcClientSecret }}: {{ .Values.secrets.oidcClientSecret | quote }}
  {{ .Values.secrets.keys.sessionSecret }}: {{ .Values.secrets.sessionSecret | quote }}
{{- end }}
