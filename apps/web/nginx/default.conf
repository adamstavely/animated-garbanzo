# nginx configuration for the Nym client.
#
# The chart mounts its own copy of this file over /etc/nginx/conf.d, so the two
# stay in step; this copy is what a plain `docker run` uses.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Kubernetes probes hit this rather than the SPA, so a probe never depends on
    # the application shell rendering.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Angular emits content-hashed filenames, so built assets can be cached hard.
    location ~* \.(?:js|css|woff2?|png|svg|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves clients on stale hashes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are Angular routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is reached through the ingress on the same host, so nothing here
    # proxies it; this only stops a stray /api request being answered with the
    # SPA shell, which would surface as a confusing JSON parse error.
    location /api/ {
        return 404;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "DENY"    always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    server_tokens off;
}
