<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Nym — Pen name desk</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nym — generate, screen and approve pen names for authors publishing under an assumed name."
    />

    <!--
      The Nym mark. The SVG is the primary icon; the .ico is the legacy fallback
      for browsers and bookmark stores that do not take an SVG, and it embeds the
      same 32px render rather than a separate drawing.
    -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Matches the canvas token in each theme, so browser chrome does not jar. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EFEFED" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121417" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
