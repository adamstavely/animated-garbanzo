<!--
  The scrim is a pointer convenience, not the keyboard path out of the dialog:
  Escape dismisses, and the Close button is the first focusable element inside.
  Making the scrim itself focusable would add a tab stop with no meaning.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<div #scrim class="modal__scrim" [class.modal__scrim--elevated]="elevated()" (click)="onBackdropClick($event)">
  <div
    #panel
    [class]="panelClasses()"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="headingId"
    cdkTrapFocus
  >
    <header class="modal__header">
      <div class="modal__titles">
        @if (eyebrow()) {
          <p class="modal__eyebrow">{{ eyebrow() }}</p>
        }
        <h2 class="modal__heading" [class.modal__heading--display]="headingStyle() === 'display'" [id]="headingId">
          {{ heading() }}
        </h2>
      </div>
      <button nymIconButton label="Close" class="modal__close" (click)="dismiss()">
        <svg lucideX class="nym-icon" [size]="22" aria-hidden="true"></svg>
      </button>
    </header>

    <div class="modal__body">
      <ng-content />
    </div>

    <footer class="modal__footer">
      <ng-content select="[modalFooter]" />
    </footer>
  </div>
</div>
