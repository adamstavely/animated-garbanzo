<span
  class="check"
  [class.check--pass]="outcome() === 'passed'"
  [class.check--fail]="outcome() === 'failed'"
  [class.check--unknown]="outcome() === 'unknown'"
  [class.check--inline]="layout() === 'inline'"
>
  @if (outcome() === 'passed') {
    <svg lucideCheck class="nym-icon check__glyph" [size]="12" aria-hidden="true"></svg>
  } @else if (outcome() === 'failed') {
    <svg lucideX class="nym-icon check__glyph" [size]="12" aria-hidden="true"></svg>
  } @else {
    <svg lucideCircleHelp class="nym-icon check__glyph" [size]="12" aria-hidden="true"></svg>
  }
  <span class="check__label">{{ label() }}</span>
</span>
