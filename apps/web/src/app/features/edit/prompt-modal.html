<nym-modal eyebrow="Model instructions" heading="Prompt" size="lg" (dismissed)="close()">
  <p class="prompt__note">{{ note() }}</p>

  <form class="prompt__form" [formGroup]="form">
    <nym-textarea-field formControlName="system" label="System instruction" density="compact" [rows]="4" />
    <nym-textarea-field formControlName="prompt" label="Generation prompt" density="compact" [rows]="15" />
  </form>

  @if (error()) {
    <p class="prompt__error" role="alert">{{ error() }}</p>
  }

  <div modalFooter class="prompt__footer">
    @if (canAdminister()) {
      <button nymButton class="prompt__reset" [disabled]="busy()" (click)="reset()">
        <svg lucideRotateCcw class="nym-icon" [size]="13" aria-hidden="true"></svg>
        <span>Reset to default</span>
      </button>
    } @else {
      <span></span>
    }

    <span class="prompt__footer-actions">
      <button nymButton (click)="close()">{{ canAdminister() ? 'Cancel' : 'Close' }}</button>
      @if (canAdminister()) {
        <button nymButton variant="primary" [disabled]="busy()" (click)="save()">
          <svg lucideSave class="nym-icon" [size]="13" aria-hidden="true"></svg>
          <span>Save prompt</span>
        </button>
      }
    </span>
  </div>
</nym-modal>
